services:
  ui:
    build: ./za-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:3000"
    environment:
      HOST: 0.0.0.0
      TRACKER_URL: ${TRACKER_URL:-}
      TRACKER_TOKEN: ${TRACKER_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000}
      PIPER_URL: ${PIPER_URL:-}
      PIPER_VOICES: ${PIPER_VOICES:-}
      LANGUAGE: ${LANGUAGE:-en}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    restart: unless-stopped
