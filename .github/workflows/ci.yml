name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: za-frontend/package-lock.json
      - run: npm ci && npm test && npm audit --omit=dev
        working-directory: za-frontend
      - run: docker compose config --quiet
      - run: docker build -t zekals-ui:test za-frontend
