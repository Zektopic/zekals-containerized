name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: za-frontend/package-lock.json
      - run: npm ci && npm test && npm audit --omit=dev
        working-directory: za-frontend
      - run: docker compose config --quiet
      - run: docker build -t zekals-ui:test za-frontend
  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo fmt --check && cargo clippy -- -D warnings && cargo test && cargo build --release
      - run: pip install -r za-backend/requirements.txt
      - run: python -m unittest discover -s za-backend/tests -v
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: za-frontend
